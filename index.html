const RULES=[
{id:'ung',g:'f',re:/(ung|heit|keit|schaft|ion|tät)$/,t:'-ung / -heit / -keit / -schaft / -ion → 거의 항상 die'},
{id:'in',g:'f',re:/in$/,t:'-in (여성형 인물) → 항상 die'},
{id:'chen',g:'n',re:/(chen|lein)$/,t:'축소형 -chen / -lein → 항상 das'},
{id:'ist',g:'m',re:/(ist|ent|ant|ekt)$/,t:'사람을 가리키는 -ist / -ent / -ant / -ekt → der'},
{id:'ie',g:'f',re:/ie$/,t:'-ie → die'},
{id:'er',g:'m',re:/(er|el)$/,t:'-er / -el (사람·직업, 가족) → 대체로 der'},
{id:'e',g:'f',re:/e$/,t:'-e로 끝나는 명사 → 대부분 die'},
{id:'o',g:'n',re:/(o|é)$/,t:'외래어 -o / -é → 대체로 das'},
];
function ruleFor(n){return RULES.find(r=>r.re.test(n.de))||null}

{let grp='A';NOUN_RAW.trim().split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){grp=l.slice(1);return}

/* ---- text helpers ---- */
const norm=s=>s.replace(/[.,!?;:"“”„]/g,' ').replace(/\s+/g,' ').trim();
const fold=s=>s.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u');
function wdiff(u,a){const U=u.split(' '),A=a.split(' '),n=U.length,m=A.length;
 const L=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=U[i]===A[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let i=0,j=0;const uo=[],ao=[];
 while(i<n&&j<m){if(U[i]===A[j]){uo.push(esc(U[i]));ao.push(esc(A[j]));i++;j++}
  else if(L[i+1][j]>=L[i][j+1]){uo.push(`<mark class="x">${esc(U[i])}</mark>`);i++}
  else{ao.push(`<mark class="m">${esc(A[j])}</mark>`);j++}}
 while(i<n)uo.push(`<mark class="x">${esc(U[i++])}</mark>`);
 while(j<m)ao.push(`<mark class="m">${esc(A[j++])}</mark>`);
 return[uo.join(' '),ao.join(' ')]}
function grade(user,answers){const u=norm(user);if(!u)return{r:'bad',best:answers[0],ud:'',ad:esc(norm(answers[0])),note:''};
 const A=answers.map(norm);
 if(A.includes(u))return{r:'ok',best:A[0]};
 const lo=A.find(a=>a.toLowerCase()===u.toLowerCase());
 if(lo)return{r:'near',best:lo,note:'대문자·소문자를 확인하세요. 독일어 명사와 문장 첫 글자는 대문자입니다.'};
 const fo=A.find(a=>fold(a)===fold(u));
 if(fo)return{r:'near',best:fo,note:'ä ö ü ß 철자를 확인하세요.'};
 let best=A[0],bs=-1;A.forEach(a=>{const s=fold(a).split(' ').filter(w=>fold(u).split(' ').includes(w)).length;if(s>bs){bs=s;best=a}});
 const [ud,ad]=wdiff(u,best);return{r:'bad',best,ud,ad,note:''}}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

 return r.g===n.g?r.t:`⚠ 예외! (${r.t}) 이지만 이 단어는 ${n.art} ${n.de}`}

   if(res){const ok=res[k];return ok?`<mark class="m">${esc(w)}</mark>${esc(p)}`:`<mark class="x">${esc(res.v[k]||'___')}</mark> <mark class="m">${esc(w)}</mark>${esc(p)}`}
   return`<input class="blank" type="text" data-k="${k}" size="${Math.max(4,w.length)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸">${esc(p)}`}).join(' ')}</div><div class="ko">${esc(l[2])}</div></div>`}).join('')}</div>
 <div class="row">${res?`<div class="fb ${res.score===D.blanks.size?'ok':'near'}" style="margin:0"><b>${res.score} / ${D.blanks.size}</b> 맞혔어요</div>`:`<button class="pri" data-a="dcheck">채점</button>`}<button data-a="dnew">새 빈칸으로</button></div>`}
function genBlanks(d){const s=new Set();d.lines.forEach((l,li)=>l[1].split(' ').forEach((t,ti)=>{const w=strip(t);if(w.length>=4&&Math.random()<.4)s.add(li+'-'+ti)}));
 if(s.size<3)d.lines.forEach((l,li)=>l[1].split(' ').forEach((t,ti)=>{if(strip(t).length>=5&&s.size<6)s.add(li+'-'+ti)}));D.blanks=s;D.res=null}
ACT.did=el=>{D.id=+el.dataset.v;D.blanks=null;D.res=null;render()};
ACT.dmode=el=>{D.mode=el.dataset.v;D.blanks=null;D.res=null;render()};
ACT.dko=el=>{D.ko=el.checked;render()};
ACT.dnew=()=>{D.blanks=null;render()};
ACT.dcheck=()=>{const d=DIALOGS.find(x=>x.id===D.id),res={v:{},score:0};
 document.querySelectorAll('input.blank').forEach(i=>{const k=i.dataset.k,[li,ti]=k.split('-').map(Number),ans=strip(d.lines[li][1].split(' ')[ti]);
  const g=grade(i.value,[ans]);const ok=g.r!=='bad'&&norm(i.value)===ans;res[k]=ok;res.v[k]=i.value;if(ok)res.score++;rec('dc:'+D.id+':'+k,ok)});D.res=res;render()};
ACT.dwrite=()=>{go('write');W.sub='tr';W.src='d'+D.id;ACT.wstart()};

/* ===== 모의고사 ===== */
let M=null;
function vMock(){
 if(!M)return`<h2>모의고사</h2><div class="card"><p>성별 8문항 + 문법 8문항 + 번역 4문항 = <b>20점</b>, 그리고 작문 1문항(체크리스트)으로 구성됩니다. 시간 제한은 없지만 20분 안에 끝내는 걸 목표로 해 보세요.</p><button class="pri" data-a="mstart">시작</button></div>`;
 const R=M.res;
 const gen=M.gen.map((n,i)=>`<div style="margin:12px 0"><div class="row"><span class="noun" style="font-size:20px;min-width:7em">${esc(n.de)}</span><span class="muted small">${esc(n.ko)}</span></div>
  <div class="row" style="margin-top:4px">${['der','die','das'].map(a=>`<button class="chip ${R?(a===n.art?'on':''):(M.sel['g'+i]===a?'on':'')}" ${R?'disabled':''} data-a="msel" data-k="g${i}" data-v="${a}" style="min-width:64px">${a}</button>`).join('')}
  ${R?`<span class="${R.g[i]?'das':'die'}"><b>${R.g[i]?'✓':'✗ '+esc(M.sel['g'+i]||'무응답')}</b></span>`:''}</div>${R&&!R.g[i]?`<div class="small muted">${esc(tipFor(n))}</div>`:''}</div>`).join('');
 const gr=M.gr.map((q,i)=>`<div style="margin:12px 0"><div class="q" style="font-size:17px">${i+1}. ${esc(q.text).replace('___','<u>&nbsp;</u>')}</div>
  ${q.opts.map((o,j)=>`<button class="opt ${R?(o===q.ans?'right':(M.sel['r'+i]===j?'wrong':'')):(M.sel['r'+i]===j?'on':'')}" style="margin:4px 0;padding:8px 12px" ${R?'disabled':''} data-a="msel" data-k="r${i}" data-v="${j}">${esc(o)}</button>`).join('')}
  ${R&&!R.r[i]?`<div class="small muted">${esc(q.why)}</div>`:''}</div>`).join('');
 const tr=M.tr.map((t,i)=>`<div style="margin:12px 0"><div>${i+1}. ${esc(t.ko)}</div>
  <input type="text" id="mt${i}" autocomplete="off" autocapitalize="off" spellcheck="false" ${R?'disabled':''} value="${esc(R?R.tv[i]:'')}">
  ${R?(R.t[i].r==='bad'?`<div class="fb bad small"><div>정답: <b>${R.t[i].ad}</b></div></div>`:`<div class="fb ${R.t[i].r==='ok'?'ok':'near'} small">${R.t[i].r==='ok'?'정답':'거의 정답: '+esc(R.t[i].best)}</div>`):''}</div>`).join('');
 const T=M.task;
 return`<h2>모의고사</h2>
 ${R?`<div class="card"><div class="word" style="margin:0">${R.score}<span class="muted" style="font-size:.5em"> / 20</span></div><div class="wko">성별 ${R.g.filter(Boolean).length}/8 · 문법 ${R.r.filter(Boolean).length}/8 · 번역 ${R.t.filter(x=>x.r!=='bad').length}/4 · 작문 ${R.free.list.filter(c=>c[1]).length}/${T.checks.length}</div><div class="row" style="justify-content:center"><button class="pri" data-a="mstart">새 시험</button></div></div>`:''}
 <h3>Ⅰ. 성별 (8점)</h3><div class="card">${gen}</div>
 <h3>Ⅱ. 문법 (8점)</h3><div class="card">${gr}</div>
 <h3>Ⅲ. 번역 (4점)</h3><div class="card">${tr}</div>
 <h3>Ⅳ. 작문 (체크리스트)</h3><div class="card"><p><b>${esc(T.prompt)}</b></p><p class="small muted">${esc(T.bank)}</p>
 <textarea id="mfree" ${R?'disabled':''}>${R?esc(R.fv):''}</textarea>${R?'':specBar()}
 ${R?`<ul class="chk">${R.free.list.map(c=>`<li class="${c[1]?'y':'n'}">${c[1]?'✓':'✗'} ${esc(c[0])}</li>`).join('')}</ul><div class="fb near small"><b>모범 예시</b><div class="tip">${esc(T.sample)}</div></div>`:''}</div>
 ${R?'':`<button class="pri" data-a="msub" style="width:100%;min-height:48px">채점하기</button>`}`}
ACT.mstart=()=>{const bad=shuf(GRAM.filter(g=>!g.typed));const gr=[];const seen={};
 bad.forEach(g=>{if(gr.length<8&&(seen[g.cat]||0)<2){gr.push(g);seen[g.cat]=(seen[g.cat]||0)+1}});
 M={gen:pick(NOUNS.filter(n=>n.g!=='p'),8),gr:gr.map(g=>({...g,opts:shuf([g.ans,...g.wr])})),tr:shuf(BANK.filter(b=>b.src==='u')).slice(0,4),task:TASKS[Math.random()*TASKS.length|0],sel:{},res:null};render();window.scrollTo(0,0)};
ACT.msel=el=>{if(M.res)return;const k=el.dataset.k;M.sel[k]=k[0]==='g'?el.dataset.v:+el.dataset.v;
 const v=[...document.querySelectorAll('input[id^=mt],#mfree')].map(i=>[i.id,i.value]);const y=window.scrollY;render();v.forEach(([id,val])=>{const i=document.getElementById(id);if(i)i.value=val});window.scrollTo(0,y)};
ACT.msub=()=>{const res={g:[],r:[],t:[],tv:[]};
 M.gen.forEach((n,i)=>{const ok=M.sel['g'+i]===n.art;res.g.push(ok);rec(n.id,ok)});
 M.gr.forEach((q,i)=>{const ok=q.opts[M.sel['r'+i]]===q.ans;res.r.push(ok);if(ok)delete S.gw[q.id];else S.gw[q.id]=1;rec(q.id,ok)});
 M.tr.forEach((t,i)=>{const v=$('#mt'+i).value;res.tv.push(v);const g=grade(v,t.de.split('~'));res.t.push(g);rec(t.id,g.r!=='bad')});
 const fv=$('#mfree').value;res.fv=fv;const t=norm(fv).toLowerCase();res.free={list:M.task.checks.map(c=>[c[0],c[1].test(t)])};
 res.score=res.g.filter(Boolean).length+res.r.filter(Boolean).length+res.t.filter(x=>x.r!=='bad').length;
 S.mock.push({d:dkey(),s:res.score});S.mock=S.mock.slice(-20);save();M.res=res;render();window.scrollTo(0,0)};

/* ===== shell ===== */
const TABS=[['home','홈'],['genus','성별'],['vocab','단어'],['grammar','문법'],['write','작문'],['dialog','대화문'],['mock','모의고사']];
const VIEWS={home:vHome,genus:vGenus,vocab:vVocab,grammar:vGrammar,write:vWrite,dialog:vDialog,mock:vMock};
function go(t){clearTimers();tab=t;render();window.scrollTo(0,0)}
function render(){$('#tabs').innerHTML=TABS.map(t=>`<button data-a="go" data-v="${t[0]}" ${t[0]===tab?'aria-current="true"':''}>${t[1]}</button>`).join('');
 $('#app').innerHTML=VIEWS[tab]()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'&&el.type!=='checkbox')return;
 if(el.tagName==='INPUT')return;const f=ACT[el.dataset.a];if(f)f(el,e)});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[type=checkbox][data-a]')&&ACT[el.dataset.a])ACT[el.dataset.a](el)});
document.addEventListener('input',e=>{if(e.target.id==='vq'){V.q=e.target.value;$('#vl').innerHTML=listRows()}});
let lastInp=null;
document.addEventListener('focusin',e=>{if(e.target.matches('input[type=text],textarea'))lastInp=e.target});
document.addEventListener('mousedown',e=>{if(e.target.closest('.spec'))e.preventDefault()});
ACT.ins=el=>{const i=lastInp&&document.body.contains(lastInp)&&!lastInp.disabled?lastInp:$('#pin,#tin,#gin,#win,#free,#mfree')||document.querySelector('input.blank');if(!i)return;
 const s=i.selectionStart??i.value.length,t=i.selectionEnd??s;i.value=i.value.slice(0,s)+el.dataset.v+i.value.slice(t);i.focus();i.setSelectionRange(s+1,s+1)};
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.matches('input,textarea,select')){if(e.key==='Enter'&&t.dataset.enter&&ACT[t.dataset.enter]){e.preventDefault();ACT[t.dataset.enter]()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const Q=GS.Q;
 if(tab==='genus'&&Q&&!Q.done&&Q.mode!=='plural'&&GS.mode!=='rules'){const k=e.key.toLowerCase(),m={1:'der',2:'die',3:'das',m:'der',f:'die',n:'das'};
  if(m[k]&&Q.ans==null){answerG(m[k]);e.preventDefault()}else if((e.key==='Enter'||e.key===' ')&&Q.ans!=null){ACT.gnext();e.preventDefault()}}
 else if(tab==='grammar'&&GM.Q&&!GM.Q.done&&GM.Q.ans&&e.key==='Enter'){ACT.qnext()}
 else if(tab==='write'&&W.sub==='tr'&&W.Q&&W.Q.res&&e.key==='Enter'){ACT.wnext()}
 else if(tab==='vocab'&&V.sub==='card'&&V.Q&&!V.Q.done&&(e.key===' '||e.key==='Enter')&&!V.Q.flip){ACT.flip();e.preventDefault()}});
render();
</script>
